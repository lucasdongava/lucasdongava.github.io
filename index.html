<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Case studies designed and developed by Lucas Gava.">
<meta name="theme-color" content="#ffffff">
<title>Case Studies</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{color-scheme:light}
body{min-height:100vh;min-height:100dvh;background:#fff;color:#111;font:16px/1.5 'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;align-items:center;padding:clamp(72px,16vh,160px) 24px 56px}
main{width:100%;max-width:520px}
h1{font-size:clamp(34px,6vw,48px);font-weight:600;letter-spacing:-.04em;line-height:1.08;animation:rise .9s cubic-bezier(.22,1,.36,1) both}
.by{margin-top:14px;font-size:15px;color:#6e6e73;letter-spacing:-.005em;animation:rise .9s cubic-bezier(.22,1,.36,1) .06s both}
.by a{color:#111;text-decoration:underline;text-underline-offset:3px;text-decoration-color:#c7c7cc;transition:text-decoration-color .3s}
.by a:hover{text-decoration-color:#111}
ul{list-style:none;margin-top:32px;border-top:1px solid #ececec}
li{border-bottom:1px solid #ececec;animation:rise .9s cubic-bezier(.22,1,.36,1) both;animation-delay:.12s}
a.proj{display:flex;align-items:center;gap:16px;padding:18px 4px;color:inherit;text-decoration:none;transition:padding .4s cubic-bezier(.22,1,.36,1),background .3s}
a.proj:hover{padding-left:12px;background:#fafafa}
a.proj:focus-visible{outline:2px solid #111;outline-offset:2px;border-radius:8px}
.ico{flex:0 0 auto;width:44px;height:44px;border-radius:12px;background:#111;color:#fff;display:grid;place-items:center}
.ico svg{width:22px;height:22px}
.name{flex:1;min-width:0;font-size:18px;font-weight:500;letter-spacing:-.02em}
.arr{flex:0 0 auto;width:18px;height:18px;color:#a1a1a6;transition:transform .4s cubic-bezier(.22,1,.36,1),color .3s}
a.proj:hover .arr{transform:translate(3px,-3px);color:#111}
footer{margin-top:auto;padding-top:48px;font-size:13px;color:#8e8e93}
footer a{color:#111;text-decoration:underline;text-underline-offset:3px;text-decoration-color:#c7c7cc;transition:text-decoration-color .3s}
footer a:hover{text-decoration-color:#111}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
@media (prefers-reduced-motion:reduce){h1,li,.by{animation:none}a.proj,.arr{transition:none}}
</style>
</head>
<body>
<main>
  <h1>Case Studies</h1>
  <p class="by">Design e Desenvolvimento por <a href="https://www.linkedin.com/in/lucasgava" target="_blank" rel="noopener">Lucas Gava</a></p>
  <ul id="lista"></ul>
</main>
<footer>Nuwa is a fictional project. Thoth is a real product. Both by <a href="https://www.linkedin.com/in/lucasgava" target="_blank" rel="noopener">Lucas Gava</a></footer>
<script>
// to add a project, add one more line here
var PROJETOS = [
  { nome: 'Nuwa', url: '/nuwa/',
    icone: '<svg viewBox="0 0 26 26" fill="currentColor" aria-hidden="true"><path d="M6.5 3h6l-4.6 20h-6z"/><path d="M15.5 3h6l-4.6 20h-6z"/></svg>' },
  { nome: 'Thoth', url: 'https://thothdev.com/',
    icone: '<svg viewBox="0 0 400 240" fill="currentColor" aria-hidden="true" style="width:26px;height:auto"><path d="M0 0H400V222C392 150 310 16 232 16H224A12 12 0 0 0 212 28C212 170 260 240 400 240H0C140 240 188 170 188 28A12 12 0 0 0 176 16H168C90 16 8 150 0 222Z"/></svg>' }
];
var ul = document.getElementById('lista');
PROJETOS.forEach(function (p, i) {
  var li = document.createElement('li'); li.style.animationDelay = (0.12 + i * 0.08) + 's';
  li.innerHTML = '<a class="proj" href="' + p.url + '"><span class="ico">' + p.icone + '</span><span class="name">' + p.nome + '</span><svg class="arr" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M8 7h9v9"/></svg></a>';
  ul.appendChild(li);
});
</script>
</body>
</html>
